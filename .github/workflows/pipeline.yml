name: pipeline

on:
  push:
    branches: [main]

jobs:
  release:
    uses: guilhermelinosp/templates/.github/workflows/release.yml@745ef1ca8288cd320b0b4dcf1485e34003945c79
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit

  buildx:
    needs: [release]
    uses: guilhermelinosp/templates/.github/workflows/buildx.yml@main
    secrets: inherit

  push:
    needs: [buildx, release]
    uses: guilhermelinosp/templates/.github/workflows/push.yml@main
    secrets: inherit
    with:
      image: ${{ needs.buildx.outputs.image }}
      version: ${{ needs.release.outputs.version }}

    uses: guilhermelinosp/templates/.github/workflows/buildx.yml@745ef1ca8288cd320b0b4dcf1485e34003945c79
  push:
    needs: [buildx, release]
    uses: guilhermelinosp/templates/.github/workflows/push.yml@745ef1ca8288cd320b0b4dcf1485e34003945c79