name: pipeline

on:
  push:
    branches: [main]

jobs:
  release:
    uses: guilhermelinosp/templates/.github/workflows/release.yml@9a3e1c923824fbd71b5dad45976c6e66ba2a1a01
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit

  buildx:
    needs: [release]
    uses: guilhermelinosp/templates/.github/workflows/buildx.yml@main
    secrets: inherit

  push:
    needs: [buildx, release]
    uses: guilhermelinosp/templates/.github/workflows/push.yml@main
    secrets: inherit
    with:
      image: ${{ needs.buildx.outputs.image }}
      version: ${{ needs.release.outputs.version }}

    uses: guilhermelinosp/templates/.github/workflows/buildx.yml@9a3e1c923824fbd71b5dad45976c6e66ba2a1a01
  push:
    needs: [buildx, release]
    uses: guilhermelinosp/templates/.github/workflows/push.yml@9a3e1c923824fbd71b5dad45976c6e66ba2a1a01